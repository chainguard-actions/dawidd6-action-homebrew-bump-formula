name: Test missing tag validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action should fail when tag is not provided in non-livecheck mode.
      # The tag input defaults to ${{github.ref}}, which under workflow_dispatch
      # is refs/heads/act-harness — not a tag. We override it to empty to trigger
      # the "Need 'tag' input specified" validation error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          formula: wget
          tag: ""

      - name: Assert action failed with missing tag error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when tag is not provided"
            exit 1
          fi
          echo "PASS: action correctly failed when tag was not provided"
