name: Test missing formula input causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Homebrew (Linux)
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          # No formula specified, no livecheck - should fail with validation error
          tag: "v1.0.0"
        continue-on-error: true
      - name: Assert action failed due to missing formula
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when formula is missing, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when formula input was missing"
