name: Test basic formula bump (expects failure with fake token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Verify Homebrew is available (the action adds it to PATH on Linux)
      - name: Check Homebrew is installed
        run: |
          if ! command -v brew &>/dev/null; then
            echo "INFO: brew not in PATH yet (action will add it)"
          else
            echo "INFO: brew already in PATH: $(brew --version)"
          fi

      # The action requires a real GitHub token to bump formulas.
      # With a fake token it will fail at the brew ruby step with an API error.
      # We use continue-on-error to capture the failure and assert the right
      # kind of failure occurred (not a setup/path error).
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          tap: homebrew/core
          formula: wget
          tag: refs/tags/v1.0.0
          revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          force: "true"
        env:
          GITHUB_REF: refs/tags/v1.0.0
          GITHUB_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Assert action ran (reached brew ruby step)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either fail (expected with fake token) or succeed.
          # What we do NOT want is an unexpected setup error.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure with fake token)"
