name: Test missing formula validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action should fail when formula is not provided in non-livecheck mode.
      # We capture the failure and assert the error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          # No formula provided — should trigger "Need 'formula' input specified"
          tag: refs/tags/v1.0.0

      - name: Assert action failed with missing formula error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when formula is not provided"
            exit 1
          fi
          echo "PASS: action correctly failed when formula was not provided"
