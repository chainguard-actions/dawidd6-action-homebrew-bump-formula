name: Test tap_url input (custom tap URL)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tap: dawidd6/homebrew-tap
          tap_url: https://github.com/dawidd6/homebrew-tap.git
          formula: lazygit
          tag: refs/tags/v1.0.0
      - name: Assert action ran with tap_url input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test environment without real tap access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
