name: Test missing tag input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Homebrew
        run: |
          echo /home/linuxbrew/.linuxbrew/bin >> $GITHUB_PATH
          which brew || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user_name: "Test User"
          user_email: "test@example.com"
          formula: "wget"
          tag: ""
          # tag is explicitly empty to trigger validation error

      - name: Assert action failed due to missing tag input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when tag input is missing/empty"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when tag input is missing/empty"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
