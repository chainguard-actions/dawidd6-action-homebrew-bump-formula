name: Test missing formula and tag validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires brew to be available; install it if not present
      - name: Ensure Homebrew is available
        run: |
          if ! command -v brew &>/dev/null; then
            echo "Installing Homebrew..."
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - id: action
        name: Run action without formula or tag (should fail)
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          # Both formula and tag are omitted — action should fail with validation error
          # livecheck is false (default), so formula and tag are required
          livecheck: "false"

      - name: Assert action failed due to missing formula and tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when formula and tag are not provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when both formula and tag inputs were missing"
