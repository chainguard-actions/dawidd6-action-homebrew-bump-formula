name: Test missing formula input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action without formula input (non-livecheck mode).
      # The Ruby script should die early with "Need 'formula' input specified".
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          tag: refs/tags/v1.0.0
          # formula is intentionally omitted

      - name: Assert action failed as expected
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when formula is missing"
            exit 1
          fi
          echo "PASS: action correctly failed when formula input was missing"
