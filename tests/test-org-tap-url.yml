name: Test org and tap_url inputs (expects failure with fake token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # This test exercises the org and tap_url inputs.
      # org: forks the tap repository to a GitHub organization.
      # tap_url: specifies a custom URL for the tap repository.
      # With a fake token the action will fail at the API step, but we verify
      # the action is invoked and reaches execution (not a setup/path error).
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          tap: homebrew/core
          tap_url: "https://github.com/Homebrew/homebrew-core.git"
          formula: wget
          tag: refs/tags/v1.0.0
          revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          force: "true"
          org: "test-org-placeholder"
        env:
          GITHUB_REF: refs/tags/v1.0.0
          GITHUB_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Assert action ran with org and tap_url inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with org and tap_url inputs (outcome=$OUTCOME, expected failure with fake token)"
