name: Test optional inputs coverage (force, message, no_fork, org, user_email, user_name, tap_url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with all optional inputs (expected to fail at brew level)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          user_name: "Test User"
          user_email: "test@example.com"
          message: "Automated bump from CI test"
          org: ""
          no_fork: "true"
          tap: "homebrew/core"
          tap_url: "https://github.com/Homebrew/homebrew-core.git"
          formula: "wget"
          tag: "refs/tags/v1.0.0"
          force: "true"
          livecheck: "false"
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail at the brew/GitHub API level
          # (e.g., cannot push to homebrew/core, or formula already up to date)
          # but NOT due to missing/unrecognized inputs.
          # A failure here means the inputs were passed and processed.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all optional inputs (outcome: ${{ steps.action.outcome }})"
