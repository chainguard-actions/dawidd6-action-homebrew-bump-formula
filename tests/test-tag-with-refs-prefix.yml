name: Test tag input with refs/tags/ prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Provide formula and tag (with refs/tags/ prefix) to pass input validation.
      # The action strips the refs/tags/ prefix from the tag internally.
      # It will fail at the GitHub API call due to the fake token (expected).
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          formula: wget
          tag: refs/tags/v1.0.0
          revision: abc123def456abc123def456abc123def456abc1
        env:
          GITHUB_REF: refs/tags/v1.0.0
          GITHUB_EVENT_NAME: push

      - name: Assert action failed (expected - bad token causes API failure after input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid GitHub token"
            exit 1
          fi
          echo "PASS: action correctly failed at API call stage (input validation passed with refs/tags/ prefix)"
