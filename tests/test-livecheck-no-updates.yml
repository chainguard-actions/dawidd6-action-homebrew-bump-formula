name: Test livecheck mode with no outdated formula
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Homebrew (Linux)
        run: |
          # Ensure linuxbrew is available
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          fi
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          livecheck: "true"
          # Check a specific formula that is very stable and unlikely to have updates
          formula: "hello"
          tap: "homebrew/core"
        continue-on-error: true
      - name: Assert action ran (livecheck mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # In livecheck mode, if there are no updates the action exits 0 (success)
          # If there are updates it tries to create PRs (may fail without write access)
          # Either success or failure is acceptable here - we just verify it ran
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in livecheck mode (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
