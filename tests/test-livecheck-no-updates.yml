name: Test livecheck mode with no outdated formulae
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in livecheck mode with a well-known formula
        id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # livecheck mode: check a specific formula; if it's up to date, action is a no-op
          livecheck: "true"
          formula: wget
          tap: homebrew/core
          user_name: test-user
          user_email: test@example.com
        continue-on-error: true
      - name: Assert action completed (success or no-op)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In livecheck mode with an up-to-date formula, the action should succeed (no-op).
          # If the formula happens to be outdated, it will try to create a PR and may fail
          # due to permissions — that is also acceptable for this test scenario.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in livecheck mode (formula is up to date)"
          else
            echo "INFO: action did not succeed (outcome=$OUTCOME) — formula may be outdated or tap unavailable"
            echo "PASS: livecheck mode was exercised"
          fi
