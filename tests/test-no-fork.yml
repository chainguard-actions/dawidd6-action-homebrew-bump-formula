name: Test no_fork mode (expects failure with fake token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # In no_fork mode the action uses the origin tap repository directly
      # instead of forking it. With a fake token it will fail at the API step,
      # but we verify the action is invoked and reaches execution.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          tap: homebrew/core
          formula: wget
          tag: refs/tags/v1.0.0
          revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          no_fork: "true"
          force: "true"
        env:
          GITHUB_REF: refs/tags/v1.0.0
          GITHUB_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Assert action ran in no_fork mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran in no_fork mode (outcome=$OUTCOME, expected failure with fake token)"
