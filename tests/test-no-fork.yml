name: Test no_fork input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Verify Homebrew is available
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          if ! command -v brew &>/dev/null; then
            echo "SKIP: brew not available in this environment"
            exit 0
          fi
          brew --version
          echo "Homebrew is available"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          formula: wget
          tap: homebrew/core
          tag: refs/tags/v1.2.3
          revision: abc123def456abc123def456abc123def456abc1
          no_fork: "true"

      - name: Assert action ran with no_fork input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action may fail due to API/auth issues, but it should not fail
          # due to missing inputs or setup issues. Both outcomes are acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with no_fork=true (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
