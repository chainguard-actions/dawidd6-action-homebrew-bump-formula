name: Test missing formula input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires formula and tag in non-livecheck mode.
      # With a fake token and no formula, it should fail with "Need 'formula' input specified"
      # before even reaching the GitHub API call.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          # Intentionally omit formula and tag to trigger input validation error
        env:
          GITHUB_REF: refs/tags/v1.0.0
          GITHUB_EVENT_NAME: push

      - name: Assert action failed with expected input validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing formula input"
            exit 1
          fi
          echo "PASS: action correctly failed when formula input is missing"
