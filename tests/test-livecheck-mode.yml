name: Test livecheck mode input wiring
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # In livecheck mode, formula and tag are not required.
      # The action should pass input validation and proceed to GitHub API call,
      # which will fail with a bad token (expected failure at API stage, not input stage).
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          livecheck: "true"
          formula: wget
        env:
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push

      - name: Assert action failed (expected - bad token causes API failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid GitHub token"
            exit 1
          fi
          echo "PASS: action correctly failed at API call stage (input validation passed)"
