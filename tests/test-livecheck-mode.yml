name: Test livecheck mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Homebrew
        run: |
          echo /home/linuxbrew/.linuxbrew/bin >> $GITHUB_PATH
          which brew || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user_name: "Test User"
          user_email: "test@example.com"
          livecheck: "true"
          formula: "wget"
          no_fork: "true"
          force: "true"

      - name: Assert action ran in livecheck mode (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in livecheck mode (formula is up to date or bumped)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully in livecheck mode (expected under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
