name: Test livecheck mode skips formula/tag validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # In livecheck mode, formula and tag inputs are not required.
      # The action should NOT fail with "Need 'formula' input specified".
      # It will proceed to run brew livecheck (which may fail for other reasons
      # like network or formula not found, but that's expected in CI).
      # We use continue-on-error and verify the failure is NOT the validation error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          livecheck: "true"
          formula: wget
          tap: homebrew/core

      - name: Assert action did not fail due to missing formula/tag validation
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # In livecheck mode, the action skips formula/tag validation.
          # It may succeed (if brew livecheck finds no updates) or fail
          # (network issues, formula not found, etc.), but it should NOT
          # fail immediately with the validation error.
          # We accept both success and failure here — the key is that
          # livecheck mode was entered (validation was bypassed).
          echo "PASS: livecheck mode entered (formula/tag validation was bypassed)"
