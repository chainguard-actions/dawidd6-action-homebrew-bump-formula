name: Test basic formula bump
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Homebrew
        run: |
          echo /home/linuxbrew/.linuxbrew/bin >> $GITHUB_PATH
          which brew || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user_name: "Test User"
          user_email: "test@example.com"
          tap: "homebrew/core"
          formula: "wget"
          tag: "refs/tags/v1.21.4"
          no_fork: "true"
          force: "true"

      - name: Assert action ran (formula bump attempted or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (formula bumped)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness - sentinel repo, no real tap access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
