name: Test livecheck mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Verify Homebrew is available
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          if ! command -v brew &>/dev/null; then
            echo "SKIP: brew not available in this environment"
            exit 0
          fi
          brew --version
          echo "Homebrew is available"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          formula: wget
          tap: homebrew/core
          livecheck: "true"
        env:
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push

      - name: Assert livecheck mode ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action is expected to fail because we used a fake token,
          # but it should not fail due to missing inputs or setup issues.
          # Both 'success' and 'failure' are acceptable outcomes here.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran in livecheck mode (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
