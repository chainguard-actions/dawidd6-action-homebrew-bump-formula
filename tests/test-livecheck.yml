name: Test livecheck mode (expects failure with fake token)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # In livecheck mode the action uses `brew livecheck` to find outdated
      # formulae. With a fake token it will fail at the API/brew step, but
      # we verify the action is invoked and reaches execution (not a setup error).
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          formula: wget
          livecheck: "true"
          force: "true"
        env:
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push

      - name: Assert action ran in livecheck mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran in livecheck mode (outcome=$OUTCOME, expected failure with fake token)"
